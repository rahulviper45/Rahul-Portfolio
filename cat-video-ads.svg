<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <linearGradient id="va-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="va-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a1a"/>
      <stop offset="50%" stop-color="#1a1c29"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </linearGradient>
    <linearGradient id="va-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6026"/>
      <stop offset="100%" stop-color="#ffa034"/>
    </linearGradient>
  </defs>

  <rect width="520" height="320" rx="16" fill="url(#va-bg)"/>

  <!-- Cinematic Video Frame -->
  <g transform="translate(30, 25)">
    <rect width="460" height="235" rx="12" fill="url(#va-screen)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Motion Visual Shapes in Frame -->
    <circle cx="230" cy="115" r="90" fill="#ff6026" opacity="0.08" filter="blur(20px)"/>
    <path d="M60 180 Q 150 70, 230 115 T 400 60" fill="none" stroke="url(#va-orange)" stroke-width="3" opacity="0.6"/>
    <circle cx="230" cy="115" r="50" fill="rgba(18,20,29,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="drop-shadow(0 8px 25px rgba(255,96,38,0.35))"/>
    
    <!-- Glowing Play Button -->
    <polygon points="225,103 243,115 225,127" fill="#ff6026"/>

    <!-- REC Tag & Duration -->
    <rect x="20" y="20" width="56" height="22" rx="11" fill="rgba(0,0,0,0.5)"/>
    <circle cx="32" cy="31" r="4" fill="#ef4444"/>
    <text x="42" y="35" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#ffffff">REC</text>

    <rect x="375" y="20" width="65" height="22" rx="11" fill="rgba(0,0,0,0.5)"/>
    <text x="387" y="35" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#ffffff">00:45 / 4K</text>

    <!-- Bottom Timeline Track inside video -->
    <rect x="20" y="205" width="420" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="20" y="205" width="180" height="4" rx="2" fill="url(#va-orange)"/>
    <circle cx="200" cy="207" r="6" fill="#ffffff" filter="drop-shadow(0 0 6px #ff6026)"/>
  </g>

  <!-- Sound / Track Strip at bottom -->
  <g transform="translate(30, 275)">
    <rect width="460" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <!-- Audio Waveform Bars -->
    <g fill="#ff6026" opacity="0.7">
      <rect x="20" y="8" width="3" height="12" rx="1.5"/>
      <rect x="28" y="5" width="3" height="18" rx="1.5"/>
      <rect x="36" y="10" width="3" height="8" rx="1.5"/>
      <rect x="44" y="3" width="3" height="22" rx="1.5"/>
      <rect x="52" y="7" width="3" height="14" rx="1.5"/>
      <rect x="60" y="4" width="3" height="20" rx="1.5"/>
      <rect x="68" y="9" width="3" height="10" rx="1.5"/>
      <rect x="76" y="6" width="3" height="16" rx="1.5"/>
      <rect x="84" y="11" width="3" height="6" rx="1.5"/>
      <rect x="92" y="4" width="3" height="20" rx="1.5"/>
      <rect x="100" y="8" width="3" height="12" rx="1.5"/>
      <rect x="108" y="5" width="3" height="18" rx="1.5"/>
      <rect x="116" y="2" width="3" height="24" rx="1.5"/>
      <rect x="124" y="9" width="3" height="10" rx="1.5"/>
      <rect x="132" y="6" width="3" height="16" rx="1.5"/>
      <rect x="140" y="4" width="3" height="20" rx="1.5"/>
    </g>
    <text x="360" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#94a3b8">MOTION & REELS</text>
  </g>
</svg>
