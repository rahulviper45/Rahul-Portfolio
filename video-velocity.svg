<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="vel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12"/>
      <stop offset="50%" stop-color="#0e101d"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="vel-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="vel-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6026"/>
      <stop offset="100%" stop-color="#ffa034"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vel-bg)"/>
  
  <!-- High Speed Grid & Kinetic Lines -->
  <g opacity="0.25">
    <line x1="0" y1="200" x2="1920" y2="200" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8 8"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="880" x2="1920" y2="880" stroke="#ff6026" stroke-width="1.5" stroke-dasharray="12 12"/>
  </g>
  
  <!-- Speed Streaks -->
  <path d="M-100 700 L700 300 L950 300 L150 700 Z" fill="url(#vel-cyan)" opacity="0.18"/>
  <path d="M300 850 L1200 350 L1450 350 L550 850 Z" fill="url(#vel-orange)" opacity="0.22"/>
  <path d="M700 950 L1600 450 L1950 450 L1050 950 Z" fill="url(#vel-cyan)" opacity="0.15"/>
  
  <!-- Central Typography / Brand Lockup -->
  <g transform="translate(960, 520)" text-anchor="middle">
    <text x="0" y="-40" font-family="'Inter', sans-serif" font-weight="900" font-size="76" letter-spacing="12" fill="#ffffff">VELOCITY</text>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" letter-spacing="8" fill="#ff6026">// FASTER THAN LIGHT</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="20" letter-spacing="4" fill="#94a3b8">KINETIC TYPOGRAPHY &amp; SPEED MOTION</text>
  </g>
  
  <!-- UI Overlays -->
  <rect x="80" y="80" width="160" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="110" cy="102" r="7" fill="#ef4444"/>
  <text x="130" y="108" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#ffffff">4K // 60FPS</text>
  
  <rect x="1680" y="80" width="160" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="1760" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#00f0ff">00:15 REEL</text>
</svg>
