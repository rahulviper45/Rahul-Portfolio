<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ca-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0c0d14"/>
    </linearGradient>
    <linearGradient id="ca-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6026"/>
      <stop offset="100%" stop-color="#ffa034"/>
    </linearGradient>
    <linearGradient id="ca-card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c3d"/>
      <stop offset="100%" stop-color="#141622"/>
    </linearGradient>
    <linearGradient id="ca-card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6026"/>
      <stop offset="100%" stop-color="#b83808"/>
    </linearGradient>
  </defs>

  <rect width="520" height="320" rx="16" fill="url(#ca-bg)"/>
  
  <!-- Subtle Grid Texture -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="130" y1="0" x2="130" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="390" y1="0" x2="390" y2="320"/>
  </g>

  <!-- Layered Ad Poster 1 (Left Tilt) -->
  <g transform="translate(60, 40) rotate(-6)">
    <rect width="180" height="230" rx="10" fill="url(#ca-card1)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
    <rect x="16" y="16" width="60" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
    <rect x="16" y="38" width="148" height="100" rx="6" fill="#1e202f"/>
    <circle cx="90" cy="88" r="28" fill="url(#ca-orange)" opacity="0.3"/>
    <polygon points="90,65 110,105 70,105" fill="url(#ca-orange)"/>
    <rect x="16" y="152" width="100" height="14" rx="3" fill="#ffffff"/>
    <rect x="16" y="174" width="140" height="8" rx="2" fill="#64748b"/>
    <rect x="16" y="188" width="80" height="8" rx="2" fill="#64748b"/>
    <rect x="16" y="206" width="50" height="12" rx="6" fill="#ff6026"/>
  </g>

  <!-- Layered Ad Poster 2 (Center Hero - Vibrant Orange Ad) -->
  <g transform="translate(200, 30) rotate(4)">
    <rect width="210" height="250" rx="12" fill="url(#ca-card2)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="drop-shadow(0 20px 35px rgba(255,96,38,0.25))"/>
    
    <!-- Ad Visual Elements -->
    <rect x="20" y="20" width="80" height="14" rx="7" fill="rgba(0,0,0,0.25)"/>
    <text x="32" y="31" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#ffffff" letter-spacing="1">SUMMER DROP</text>
    
    <!-- Graphic Shape in Ad -->
    <circle cx="105" cy="115" r="50" fill="#0c0d14"/>
    <circle cx="105" cy="115" r="42" fill="none" stroke="#ffa034" stroke-width="4"/>
    <path d="M85 115 L105 85 L125 115 L105 145 Z" fill="#ffffff"/>

    <rect x="20" y="185" width="130" height="18" rx="4" fill="#ffffff"/>
    <text x="28" y="198" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#0c0d14">BOLD CREATIVE</text>
    
    <rect x="20" y="210" width="170" height="6" rx="2" fill="rgba(255,255,255,0.7)"/>
    <rect x="20" y="222" width="110" height="6" rx="2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="185" cy="194" r="12" fill="#0c0d14"/>
    <path d="M182 194 L187 194 M185 191 L188 194 L185 197" stroke="#ffa034" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Tag Pill Overlay -->
  <g transform="translate(30, 260)">
    <rect width="120" height="30" rx="15" fill="rgba(18,20,29,0.85)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="16" cy="15" r="4" fill="#ff6026"/>
    <text x="28" y="19" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#ffffff" letter-spacing="0.5">PERFORMANCE ADS</text>
  </g>
</svg>
