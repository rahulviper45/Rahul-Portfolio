<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191528"/>
      <stop offset="100%" stop-color="#0e0a17"/>
    </linearGradient>
    <linearGradient id="ill-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6026"/>
      <stop offset="100%" stop-color="#ffb03a"/>
    </linearGradient>
    <linearGradient id="ill-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="ill-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6026" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6026" stop-opacity="0"/>
    </radialGradient>
    <filter id="ill-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="520" height="320" rx="16" fill="url(#ill-bg)"/>
  
  <!-- Subtle Radial Glow in Center -->
  <circle cx="260" cy="160" r="160" fill="url(#ill-glow)"/>

  <!-- Artistic Drafting Grid / Compass Circles -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="260" cy="160" r="120" fill="none" stroke-dasharray="4,6"/>
    <circle cx="260" cy="160" r="80" fill="none"/>
    <line x1="140" y1="160" x2="380" y2="160"/>
    <line x1="260" y1="40" x2="260" y2="280"/>
  </g>

  <!-- Art Canvas Frame -->
  <rect x="90" y="35" width="340" height="250" rx="14" fill="#141121" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>

  <!-- Canvas Header Bar / Tag -->
  <g transform="translate(105, 50)">
    <circle cx="8" cy="8" r="4" fill="#ff6026"/>
    <circle cx="24" cy="8" r="4" fill="#ffb03a"/>
    <circle cx="40" cy="8" r="4" fill="#8b5cf6"/>
    <rect x="60" y="3" width="70" height="10" rx="5" fill="rgba(255,255,255,0.1)"/>
    <rect x="260" y="3" width="50" height="10" rx="5" fill="rgba(255,96,38,0.2)"/>
  </g>

  <!-- Main Illustration Artwork Area -->
  <g transform="translate(105, 75)">
    <!-- Artwork Background -->
    <rect width="310" height="195" rx="8" fill="#1b172d"/>

    <!-- Dynamic Curved Brush Strokes / Waves -->
    <path d="M 10 170 C 60 110, 110 180, 170 120 C 220 70, 260 130, 300 90 L 300 195 L 10 195 Z" fill="url(#ill-purple)" opacity="0.4"/>
    <path d="M 0 185 C 70 140, 130 190, 190 135 C 240 90, 270 145, 310 115 L 310 195 L 0 195 Z" fill="url(#ill-orange)" opacity="0.85"/>

    <!-- Stylized Sun / Eclipse Art Element -->
    <circle cx="225" cy="75" r="42" fill="url(#ill-orange)" filter="url(#ill-soft-glow)"/>
    <circle cx="225" cy="75" r="42" fill="url(#ill-orange)"/>
    <circle cx="210" cy="65" r="32" fill="#1b172d" opacity="0.85"/>

    <!-- Fluid Star / Sparkle Accents -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M 70 45 Q 70 55 60 55 Q 70 55 70 65 Q 70 55 80 55 Q 70 55 70 45 Z"/>
      <path d="M 285 45 Q 285 52 278 52 Q 285 52 285 59 Q 285 52 292 52 Q 285 52 285 45 Z" opacity="0.7"/>
      <circle cx="110" cy="80" r="2.5"/>
      <circle cx="150" cy="45" r="1.5"/>
    </g>

    <!-- Stylized Character / Organic Silhouette -->
    <path d="M 80 195 C 80 150, 100 130, 125 125 C 135 110, 130 95, 118 92 C 105 88, 100 75, 105 60 C 112 42, 132 40, 142 50 C 152 60, 150 72, 142 82 C 148 90, 155 105, 150 120 C 170 126, 185 145, 190 195 Z" fill="#0f0c1c" opacity="0.95"/>

    <!-- Pen / Stylus Tool Overlay Floating -->
    <g transform="translate(195, 110) rotate(-40)" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.6))">
      <!-- Stylus Body -->
      <rect x="0" y="0" width="16" height="110" rx="8" fill="#2d3142" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <rect x="0" y="15" width="16" height="30" fill="#ff6026"/>
      <!-- Nib -->
      <polygon points="2,110 8,126 14,110" fill="#1a1c24"/>
      <circle cx="8" cy="126" r="2" fill="#ffb03a"/>
      <!-- Accent ring -->
      <rect x="0" y="60" width="16" height="4" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>
</svg>
