<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <linearGradient id="wc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="wc-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2336"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <linearGradient id="wc-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6026"/>
      <stop offset="100%" stop-color="#ffa034"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" rx="16" fill="url(#wc-bg)"/>

  <!-- Browser Window Mockup (640x320 2:1 format) -->
  <g transform="translate(30, 25)">
    <!-- Browser Chrome -->
    <rect width="580" height="270" rx="12" fill="url(#wc-banner)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect width="580" height="34" rx="12" fill="#181b2a"/>
    <rect y="22" width="580" height="12" fill="#181b2a"/>
    
    <!-- Browser Dots -->
    <circle cx="20" cy="17" r="4" fill="#ef4444"/>
    <circle cx="34" cy="17" r="4" fill="#eab308"/>
    <circle cx="48" cy="17" r="4" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="70" y="9" width="220" height="16" rx="8" fill="#11131e"/>
    <text x="85" y="21" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">brand-experience.com</text>

    <!-- Website Hero Banner Area -->
    <rect x="18" y="48" width="544" height="145" rx="8" fill="#0f111a" stroke="rgba(255,96,38,0.2)"/>
    
    <!-- Banner Content Elements -->
    <g transform="translate(35, 65)">
      <rect width="90" height="10" rx="5" fill="rgba(255,96,38,0.3)"/>
      <rect y="18" width="200" height="18" rx="4" fill="#ffffff"/>
      <rect y="44" width="150" height="12" rx="3" fill="#ffffff"/>
      <rect y="66" width="240" height="6" rx="2" fill="#64748b"/>
      <rect y="78" width="180" height="6" rx="2" fill="#64748b"/>
      
      <!-- CTA Button in Mockup -->
      <rect y="96" width="105" height="24" rx="12" fill="url(#wc-orange)"/>
      <text x="18" y="112" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#ffffff">DISCOVER</text>
    </g>

    <!-- Visual 3D / Graphic in Banner -->
    <g transform="translate(390, 65)">
      <circle cx="65" cy="55" r="45" fill="url(#wc-orange)" opacity="0.15"/>
      <circle cx="65" cy="55" r="35" fill="#181b29" stroke="url(#wc-orange)" stroke-width="2"/>
      <polygon points="65,30 85,75 45,75" fill="url(#wc-orange)"/>
    </g>

    <!-- Mini Promo Banners Row -->
    <g transform="translate(18, 204)">
      <rect width="174" height="52" rx="6" fill="#151825" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="25" cy="26" r="10" fill="#ff6026"/>
      <rect x="44" y="18" width="70" height="6" rx="2" fill="#ffffff"/>
      <rect x="44" y="28" width="90" height="4" rx="1" fill="#64748b"/>

      <rect x="185" y="0" width="174" height="52" rx="6" fill="#151825" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="210" cy="26" r="10" fill="#38bdf8"/>
      <rect x="229" y="18" width="75" height="6" rx="2" fill="#ffffff"/>
      <rect x="229" y="28" width="90" height="4" rx="1" fill="#64748b"/>

      <rect x="370" y="0" width="174" height="52" rx="6" fill="#151825" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="395" cy="26" r="10" fill="#a855f7"/>
      <rect x="414" y="18" width="65" height="6" rx="2" fill="#ffffff"/>
      <rect x="414" y="28" width="90" height="4" rx="1" fill="#64748b"/>
    </g>
  </g>
</svg>
