<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a17"/>
      <stop offset="50%" stop-color="#120f26"/>
      <stop offset="100%" stop-color="#06060d"/>
    </linearGradient>
    <linearGradient id="fin-emerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="fin-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#fin-bg)"/>
  
  <!-- Isometric Graph Visualizations -->
  <g opacity="0.35" transform="translate(960, 480)">
    <!-- Floating Chart Bars -->
    <rect x="-350" y="50" width="60" height="240" rx="10" fill="url(#fin-purple)"/>
    <rect x="-260" y="-20" width="60" height="310" rx="10" fill="url(#fin-emerald)"/>
    <rect x="-170" y="-120" width="60" height="410" rx="10" fill="url(#fin-purple)"/>
    <rect x="-80" y="-60" width="60" height="350" rx="10" fill="url(#fin-emerald)"/>
    <rect x="10" y="-180" width="60" height="470" rx="10" fill="url(#fin-purple)"/>
    <rect x="100" y="-100" width="60" height="390" rx="10" fill="url(#fin-emerald)"/>
    <rect x="190" y="-260" width="60" height="550" rx="10" fill="url(#fin-purple)"/>
    <rect x="280" y="-320" width="60" height="610" rx="10" fill="url(#fin-emerald)"/>
  </g>
  
  <!-- Glowing Chart Polyline -->
  <path d="M400 780 Q 750 600, 1050 480 T 1600 240" fill="none" stroke="url(#fin-emerald)" stroke-width="6" opacity="0.8"/>
  <circle cx="1600" cy="240" r="12" fill="#00f5a0"/>
  
  <!-- Central Typography / Brand Lockup -->
  <g transform="translate(960, 520)" text-anchor="middle">
    <text x="0" y="-40" font-family="'Inter', sans-serif" font-weight="900" font-size="76" letter-spacing="10" fill="#ffffff">FINTRACK</text>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" letter-spacing="8" fill="#00f5a0">// FUTURE OF WEALTH</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="20" letter-spacing="4" fill="#94a3b8">UI MOTION GRAPHICS &amp; 3D PRODUCT ANIMATION</text>
  </g>
  
  <rect x="80" y="80" width="160" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="110" cy="102" r="7" fill="#00f5a0"/>
  <text x="130" y="108" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#ffffff">APP PROMO</text>
</svg>
