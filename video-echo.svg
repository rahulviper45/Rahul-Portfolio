<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="echo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="echo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#echo-bg)"/>
  
  <!-- Concentric Sound Rings -->
  <g opacity="0.25" transform="translate(960, 480)">
    <circle r="180" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle r="280" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="14 14"/>
    <circle r="380" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle r="480" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="20 12"/>
    <circle r="580" fill="none" stroke="#818cf8" stroke-width="1"/>
  </g>
  
  <!-- Audio Waveform Center Ribbon -->
  <g opacity="0.6" transform="translate(960, 500)">
    <path d="M-600 0 Q -450 -120, -300 0 T 0 0 T 300 0 T 600 0" fill="none" stroke="url(#echo-glow)" stroke-width="4"/>
    <path d="M-600 0 Q -450 120, -300 0 T 0 0 T 300 0 T 600 0" fill="none" stroke="url(#echo-glow)" stroke-width="4" opacity="0.7"/>
  </g>
  
  <!-- Central Typography / Brand Lockup -->
  <g transform="translate(960, 520)" text-anchor="middle">
    <text x="0" y="-40" font-family="'Inter', sans-serif" font-weight="900" font-size="76" letter-spacing="10" fill="#ffffff">ECHO</text>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" letter-spacing="8" fill="#38bdf8">// HEAR EVERYTHING</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="20" letter-spacing="4" fill="#94a3b8">ACOUSTIC MOTION GRAPHICS &amp; SOUND DESIGN</text>
  </g>
  
  <rect x="80" y="80" width="160" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="110" cy="102" r="7" fill="#38bdf8"/>
  <text x="130" y="108" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#ffffff">SPATIAL 3D</text>
</svg>
