<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="hor-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#150a28"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="hor-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#hor-bg)"/>
  
  <!-- Perspective Laser Grid Floor -->
  <g opacity="0.35">
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#ff007f" stroke-width="1.5"/>
    <line x1="0" y1="880" x2="1920" y2="880" stroke="#ff007f" stroke-width="2"/>
    <line x1="0" y1="970" x2="1920" y2="970" stroke="#ff007f" stroke-width="2.5"/>
    <line x1="0" y1="1070" x2="1920" y2="1070" stroke="#ff007f" stroke-width="3"/>
    
    <!-- Vanishing Lines to Center Horizon -->
    <line x1="960" y1="720" x2="100" y2="1080" stroke="#7928ca" stroke-width="2"/>
    <line x1="960" y1="720" x2="400" y2="1080" stroke="#7928ca" stroke-width="2"/>
    <line x1="960" y1="720" x2="700" y2="1080" stroke="#7928ca" stroke-width="2"/>
    <line x1="960" y1="720" x2="960" y2="1080" stroke="#ff007f" stroke-width="2.5"/>
    <line x1="960" y1="720" x2="1220" y2="1080" stroke="#7928ca" stroke-width="2"/>
    <line x1="960" y1="720" x2="1520" y2="1080" stroke="#7928ca" stroke-width="2"/>
    <line x1="960" y1="720" x2="1820" y2="1080" stroke="#7928ca" stroke-width="2"/>
  </g>
  
  <!-- Neon Sun / Horizon Arc -->
  <circle cx="960" cy="720" r="280" fill="none" stroke="url(#hor-neon)" stroke-width="5" opacity="0.7"/>
  
  <!-- Central Typography / Brand Lockup -->
  <g transform="translate(960, 520)" text-anchor="middle">
    <text x="0" y="-40" font-family="'Inter', sans-serif" font-weight="900" font-size="76" letter-spacing="10" fill="#ffffff">HORIZON 2024</text>
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" letter-spacing="8" fill="#ff007f">// FESTIVAL REVEAL</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="20" letter-spacing="4" fill="#94a3b8">3D CHROME MOTION GRAPHICS &amp; EVENT TRAILER</text>
  </g>
  
  <rect x="80" y="80" width="160" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="110" cy="102" r="7" fill="#ff007f"/>
  <text x="130" y="108" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#ffffff">FESTIVAL TRAILER</text>
</svg>
